[project]
name = "ai-orchestrator-mvp"
version = "0.1.73"
description = "Minimal workflow-first AI task orchestrator with plan/execute/validate/rework loop."
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "uvicorn>=0.29",
]

[project.scripts]
ai-orchestrator = "ai_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_orchestrator = ["prompts/reviewers/*.md"]
ai_orchestrator_web = ["templates/*.html", "static/*.css"]
