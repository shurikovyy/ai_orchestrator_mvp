[project]
name = "ai-orchestrator-mvp"
version = "0.1.8"
description = "Minimal workflow-first AI task orchestrator with plan/execute/validate/rework loop."
requires-python = ">=3.10,<3.14"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.scripts]
ai-orchestrator = "ai_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
